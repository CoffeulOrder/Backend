name: CI

# PR에서 자동으로 도는 유일한 검사. 이게 없던 동안은 각자 로컬 `./mvnw test`가 유일한 근거였고,
# 누가 깨진 걸 push해도 PR에서 잡히지 않았다.
on:
  pull_request:
  push:
    # develop은 테스트가 통과하면 개발 서버(api.orso.it.kr)에 자동 배포한다 — 아래 deploy 작업.
    branches: [main, develop]

# 같은 브랜치에 연달아 push하면 이전 실행을 취소한다 — 러너 시간을 아끼고 결과도 최신 것만 남는다.
concurrency:
  group: ci-${{ github.ref }}
  # develop은 취소하지 않는다 — 배포 도중에 다음 push가 와도 앞 배포를 끝낸 뒤 순서대로 돈다.
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  test:
    name: 테스트 (실제 MySQL)
    runs-on: ubuntu-latest
    # Testcontainers가 MySQL 8.4 이미지를 받는 첫 실행이 오래 걸린다. 그래도 매달리지 않게 상한을 둔다.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 프로젝트 기준은 21이다 (pom의 java.version).
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ubuntu-latest 러너에는 Docker가 이미 떠 있어서 Testcontainers가 그대로 돈다
      # (AbstractIntegrationTest가 MySQL 8.4 컨테이너를 띄운다).
      - name: ./mvnw test
        run: ./mvnw --batch-mode --no-transfer-progress test

      # 실패했을 때 로그만 보고 원인을 못 찾는 경우가 많아서 리포트를 통째로 올려둔다.
      - name: 실패 시 surefire 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # develop에 머지되고 위 테스트가 통과했을 때만 돈다. PR에서는 돌지 않는다.
  # GitHub에는 AWS 키를 두지 않는다 — OIDC로 ormo-github-deploy 역할을 잠깐 빌리고,
  # 그 역할은 개발 서버 한 대에 SSM 명령을 보내는 것만 할 수 있다(신뢰 조건: 이 레포의 develop).
  # 서버에서는 deploy/deploy.sh가 빌드·교체·상태 확인을 하고, 실패하면 직전 이미지로 되돌린 뒤 실패로 끝난다.
  deploy:
    name: 개발 서버 배포
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: AWS 역할 빌리기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 서버에서 deploy.sh 실행
        env:
          INSTANCE_ID: ${{ vars.DEV_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy $SHA (run $GITHUB_RUN_ID)" \
            --timeout-seconds 1500 \
            --parameters "commands=['/opt/ormo/Backend/deploy/deploy.sh $SHA 2>&1 | grep -v Extracting | tail -60; exit \${PIPESTATUS[0]}']" \
            --query Command.CommandId --output text)
          echo "SSM command: $CID"
          STATUS=Pending
          for i in $(seq 1 170); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          echo "결과: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: 바깥에서 상태 확인
        run: curl --fail --silent --show-error --max-time 15 https://api.orso.it.kr/actuator/health
