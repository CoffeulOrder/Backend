name: CI

# PR에서 자동으로 도는 유일한 검사. 이게 없던 동안은 각자 로컬 `./mvnw test`가 유일한 근거였고,
# 누가 깨진 걸 push해도 PR에서 잡히지 않았다.
on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연달아 push하면 이전 실행을 취소한다 — 러너 시간을 아끼고 결과도 최신 것만 남는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 테스트 (실제 MySQL)
    runs-on: ubuntu-latest
    # Testcontainers가 MySQL 8.4 이미지를 받는 첫 실행이 오래 걸린다. 그래도 매달리지 않게 상한을 둔다.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # 프로젝트 기준은 21이다 (pom의 java.version).
      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ubuntu-latest 러너에는 Docker가 이미 떠 있어서 Testcontainers가 그대로 돈다
      # (AbstractIntegrationTest가 MySQL 8.4 컨테이너를 띄운다).
      - name: ./mvnw test
        run: ./mvnw --batch-mode --no-transfer-progress test

      # 실패했을 때 로그만 보고 원인을 못 찾는 경우가 많아서 리포트를 통째로 올려둔다.
      - name: 실패 시 surefire 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
