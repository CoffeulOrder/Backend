# 개발 서버(api.orso.it.kr) 배포 구성. EC2 한 대에 Caddy(HTTPS) · backend · MySQL을 같이 올린다.
# 비밀값은 커밋하지 않는다 — deploy.sh가 AWS Parameter Store(/ormo/dev/*)에서 읽어 .env를 만든다.
# 로컬 개발용은 레포 루트의 docker-compose.yml을 쓴다.
name: ormo

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

  backend:
    image: ormo-backend:${IMAGE_TAG:-latest}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:mysql://mysql:3306/coffeul?serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: coffeul
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ap-northeast-2
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-fake}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_FROM: no-reply@orso.it.kr
      # dev 전용 가짜 결제 확정(루트 docker-compose.yml과 같다). dev 프로필 + fake 게이트웨이일 때만 동작한다. 운영 서버에는 넣지 않는다.
      # 포트원(PAYMENT_GATEWAY=portone)일 때만 쓰인다. 값은 Parameter Store /ormo/dev/PORTONE_* 에서 온다.
      COFFEUL_PAYMENT_PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
      COFFEUL_PAYMENT_PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET:-}
      COFFEUL_PAYMENT_PORTONE_WEBHOOK_ENABLED: ${PORTONE_WEBHOOK_ENABLED:-false}
      SPRING_APPLICATION_JSON: '{"coffeul.dev.payment-flow-enabled":true}'
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    expose:
      - "8080"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: coffeul
      MYSQL_USER: coffeul
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--innodb-buffer-pool-size=256M"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # 프런트 연동용 가짜 사장님·매장·메뉴·계정. 필요할 때만: docker compose --profile seed run --rm dev-seed
  dev-seed:
    image: mysql:8.4
    profiles: ["seed"]
    restart: "no"
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
    volumes:
      - ../docker/dev-seed:/dev-seed:ro
      - ../src/main/resources/db/seed:/menu-seed:ro
    entrypoint: ["sh", "/dev-seed/run.sh"]

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
